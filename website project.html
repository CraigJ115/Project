  <a class="nav-logo" href="#">

  <div class="page-hero">
    <h1>Explore the Collections</h1>
    <p>Search and discover objects from the V&amp;A's permanent collection of over 2.3 million works.</p>
  </div>

  <!-- search bar -->
  <div class="main-search-bar">
    <div class="search-bar-inner">
      <div class="search-bar-row">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search the collections…" />
          <button id="btn-search-go" class="btn-search-go" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
          <button id="btn-voice-interact" title="Voice control" class="btn-voice-interact">Click to interact with voice</button>
        </div>
        <button id="btn-show-help" class="btn-help" title="How to use">? Help</button>
      </div>
      <span id="voice-status"></span>
    </div>
  </div>

  <!-- Page body -->
  <section class="page-body">
    <main class="main-content">
      <!-- Toolbar -->
      <div class="toolbar">
        <div>
          <div id="result-count" class="result-count">Searching…</div>
          <div id="result-query" class="result-query"></div>
        </div>
      </div>
      <!-- Results -->
      <div id="results"></div>
      <!-- Pagination -->
      <div id="pagination"></div>
      <!-- Modal -->
      <div id="modal-root"></div>
      <!-- Welcome Modal -->
      <div id="welcome-modal-root"></div>
      <!-- Recommendations Modal -->
      <div id="rec-modal-root"></div>
    </main>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
